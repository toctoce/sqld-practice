<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLD Practice - Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">회원가입</h1>
        <p class="text-gray-500">SQLD 합격을 위한 여정을 시작하세요!</p>
    </div>

    <div th:if="${errorMessage}" class="mb-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 text-sm">
        <p th:text="${errorMessage}"></p>
    </div>

    <form action="/signup" method="POST" class="space-y-5" novalidate>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">이메일 주소</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                   placeholder="example@gmail.com">
        </div>

        <div>
            <label for="nickname" class="block text-sm font-medium text-gray-700 mb-1">닉네임</label>
            <input type="text" id="nickname" name="nickname" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                   placeholder="멋진 닉네임을 정해주세요">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                   placeholder="8자 이상 입력 (영문, 숫자 포함)">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200 mt-4">
            가입하기
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-sm text-gray-500">
            이미 계정이 있으신가요?
            <a href="/login" class="text-blue-600 hover:underline ml-1 font-medium">로그인하기</a>
        </p>
    </div>
</div>

</body>
</html>
