<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLD Practice - Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

<div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md text-center">
    <div class="flex justify-center mb-6">
        <div class="bg-red-100 p-4 rounded-full">
            <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
    </div>

    <h1 class="text-2xl font-bold text-gray-800 mb-2">문제가 발생했습니다</h1>
    <p class="text-gray-500 mb-8" th:text="${errorMessage}">알 수 없는 오류가 발생했습니다.</p>

    <div class="space-y-3">
        <button onclick="history.back()"
                class="w-full bg-gray-800 text-white font-semibold py-3 rounded-lg hover:bg-gray-900 transition duration-200">
            이전 페이지로
        </button>
        <a href="/login"
           class="block w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200">
            로그인 화면으로
        </a>
    </div>

    <p class="mt-8 text-xs text-gray-400">SQLD Practice Support</p>
</div>

</body>
</html>
