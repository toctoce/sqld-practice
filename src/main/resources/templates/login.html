<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLD Practice - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">SQLD Practice</h1>
        <p class="text-gray-500">열공을 위한 첫 걸음, 로그인을 해주세요.</p>
    </div>

    <form action="/login" method="POST" class="space-y-6">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">아이디(이메일)</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                   placeholder="example@gmail.com">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                   placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition duration-200">
            로그인
        </button>
    </form>

    <div class="mt-8 flex flex-col space-y-3">
        <div class="flex justify-between text-sm text-gray-500 px-1">
            <a href="/find-password" class="hover:text-blue-600 transition">비밀번호 찾기</a>
            <span class="text-gray-300">|</span>
            <a href="/signup" class="hover:text-blue-600 transition font-medium text-blue-500">회원가입</a>
        </div>

        <div class="relative flex py-3 items-center">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">또는</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <p class="text-center text-xs text-gray-400">SNS 계정으로 간편하게 시작하기</p>
    </div>
</div>

</body>
</html>
