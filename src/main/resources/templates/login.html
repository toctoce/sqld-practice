<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLD Practice - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">SQLD Practice</h1>
        <p class="text-gray-500">열공을 위한 첫 걸음, 로그인을 해주세요.</p>
    </div>

    <form action="/login" method="POST" class="space-y-6">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">아이디(이메일)</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                   placeholder="example@gmail.com">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                   placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition duration-200">
            로그인
        </button>
    </form>

    <div class="mt-8 flex flex-col space-y-3">
        <div class="flex justify-between text-sm text-gray-500 px-1">
            <a href="/find-password" class="hover:text-blue-600 transition">비밀번호 찾기</a>
            <span class="text-gray-300">|</span>
            <a href="/signup" class="hover:text-blue-600 transition font-medium text-blue-500">회원가입</a>
        </div>

        <div class="relative flex py-3 items-center">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">또는</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <p class="text-center text-xs text-gray-400">SNS 계정으로 간편하게 시작하기</p>

        <div class="grid grid-cols-1 gap-3 mt-2">
            <a href="/oauth2/authorization/google"
               class="flex items-center justify-center gap-3 w-full py-2.5 border border-gray-300 rounded-lg bg-white text-gray-700 font-medium hover:bg-gray-50 transition duration-200">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"
                     alt="Google">
                <span>Google로 계속하기</span>
            </a>

            <a href="/oauth2/authorization/kakao"
               class="flex items-center justify-center gap-3 w-full py-2.5 rounded-lg bg-[#FEE500] text-[#191919] font-medium hover:bg-[#FADB00] transition duration-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3C7.029 3 3 6.129 3 10.012c0 2.529 1.637 4.75 4.125 5.961l-.971 3.562c-.042.155.05.313.203.353.05.013.102.01.149-.009l4.162-2.744c.433.062.879.092 1.332.092 4.971 0 9-3.129 9-7.012C21 6.129 16.971 3 12 3z"/>
                </svg>
                <span>카카오로 계속하기</span>
            </a>
        </div>
    </div>
</div>

</body>
</html>
